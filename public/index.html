<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BillShield</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:52rem;margin:2rem auto;padding:0 1rem;color:#222}
  label{display:block;margin:1rem 0 .3rem;font-weight:600}
  textarea,input:not([type=file]){width:100%;box-sizing:border-box;font:inherit;padding:.5rem}
  button{padding:.5rem 1.2rem;margin:.8rem .5rem 0 0;font:inherit;cursor:pointer}
  table{width:100%;border-collapse:collapse;margin-top:1rem}
  th,td{border:1px solid #ccc;padding:.4rem .6rem;text-align:left;vertical-align:top}
  td.amt{text-align:right;white-space:nowrap}
  tr.flag{background:#fff3cd}
  #status{margin-top:1rem;color:#555;white-space:pre-wrap}
  .hidden{display:none}
  #who{color:#555;margin:-.5rem 0 1rem}
  #who button{margin:0 0 0 .5rem;padding:.1rem .6rem}
</style>

<h1>BillShield</h1>

<form id="signin" class="hidden">
  <p>Tell us who you are so your bills and messages are saved to you.</p>
  <label for="name">Your name</label>
  <input id="name" name="name" autocomplete="name" required>
  <label for="email">Email</label>
  <input id="email" name="email" type="email" autocomplete="email" required>
  <button type="submit">Continue</button>
  <div id="signin-status"></div>
</form>

<main id="app" class="hidden">
<div id="who"><span id="who-name"></span><button id="switch" type="button">Switch user</button></div>

<form id="upload">
  <label for="file">Bill (PDF or photo)</label>
  <input id="file" name="file" type="file" accept="application/pdf,image/png,image/jpeg,image/webp" required>
  <label for="provider">Company (optional)</label>
  <input id="provider" name="provider" placeholder="Airtel">
  <label for="expectation">What were you promised?</label>
  <textarea id="expectation" name="expectation" rows="4" required
    placeholder="₹499/month unlimited plan, no add-on packs, GST included"></textarea>
  <button type="submit">Submit</button>
</form>

<div id="status"></div>

<section id="result" class="hidden">
  <table>
    <thead><tr><th>#</th><th>Description</th><th>Amount</th><th>Why</th><th>Seen before</th></tr></thead>
    <tbody id="lines"></tbody>
  </table>
  <label for="message">Proposed message to the company</label>
  <textarea id="message" rows="10"></textarea>
  <label for="feedback">What should change? (for Revise)</label>
  <textarea id="feedback" rows="2" placeholder="Shorter, firmer, mention I've paid on time for 2 years"></textarea>
  <button id="revise">Revise</button>
  <button id="accept">Accept</button>
</section>
</main>

<script>
let billId = null;
let token = null;
const $ = id => document.getElementById(id);
const store = {
  get: k => { try { return localStorage.getItem(k); } catch { return null; } },
  set: (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} },
};

async function call(url, opts = {}) {
  const r = await fetch(url, {...opts, headers: {...opts.headers, Authorization: `Bearer ${token}`}});
  if (r.status === 401) { signOut(); throw new Error("Please sign in again."); }
  if (!r.ok) throw new Error(`Error ${r.status}: ${await r.text()}`);
  return r.json();
}

function showApp(user) {
  $("who-name").textContent = `Signed in as ${user.name} (${user.email})`;
  $("signin").classList.add("hidden");
  $("app").classList.remove("hidden");
}

function signOut() {
  token = null;
  store.set("billshield_token", null);
  billId = null;
  $("result").classList.add("hidden");
  $("status").textContent = "";
  $("app").classList.add("hidden");
  $("signin").classList.remove("hidden");
}

$("signin").onsubmit = async e => {
  e.preventDefault();
  $("signin-status").textContent = "Saving…";
  const r = await fetch("/api/users", {method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({name: $("name").value, email: $("email").value})});
  if (!r.ok) { $("signin-status").textContent = `Error ${r.status}: ${await r.text()}`; return; }
  const user = await r.json();
  token = user.token;
  store.set("billshield_token", token);
  $("signin-status").textContent = "";
  showApp(user);
};

$("switch").onclick = signOut;

(async () => {
  token = store.get("billshield_token");
  if (!token) return signOut();
  try { showApp(await call("/api/me")); } catch { signOut(); }
})();

function render(bill) {
  billId = bill.id;
  $("lines").replaceChildren(...bill.line_items.map((l, i) => {
    const tr = document.createElement("tr");
    if (l.is_flagged) tr.className = "flag";
    const sign = l.kind === "discount" ? "−" : "";
    const seen = l.seen_before ? `${l.seen_before} earlier bill${l.seen_before > 1 ? "s" : ""}` : "";
    for (const [text, cls] of [[i + 1], [l.description], [`${sign}₹${Number(l.amount).toFixed(2)}`, "amt"],
                               [l.fact || l.plain_words || ""], [seen]]) {
      const td = Object.assign(document.createElement("td"), {textContent: text});
      if (cls) td.className = cls;
      tr.append(td);
    }
    return tr;
  }));
  const m = bill.message || {};
  const sent = m.status === "sent";
  $("message").value = (sent ? m.sent_text : m.draft_text) || "";
  $("result").classList.remove("hidden");
  $("revise").disabled = $("accept").disabled = sent;
  $("status").textContent = sent ? `Accepted. ${m.words_changed} words changed. Now send it.`
                                 : m.version > 1 ? `Draft version ${m.version}` : "";
}

async function run(label, fn) {
  $("status").textContent = label;
  try { render(await fn()); } catch (e) { $("status").textContent = e.message; }
}

$("upload").onsubmit = e => {
  e.preventDefault();
  run("Reading your bill…", () => call("/api/bills", {method: "POST", body: new FormData(e.target)}));
};

$("revise").onclick = () => run("Rewriting…", () => call(`/api/bills/${billId}/revise`, {
  method: "POST", headers: {"Content-Type": "application/json"},
  body: JSON.stringify({feedback: $("feedback").value}),
}));

$("accept").onclick = () => run("Saving…", () => call(`/api/bills/${billId}/accept`, {
  method: "POST", headers: {"Content-Type": "application/json"},
  body: JSON.stringify({message: $("message").value}),
}));
</script>
